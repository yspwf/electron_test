<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标放大模糊背景样式</title>
    <style>
        /* 基础重置，让页面居中显示 */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #000; /* 页面背景色 */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        /* 外层容器 */
        .container {
            position: relative;
            width: 300px;   /* 可根据需要调整大小 */
            height: 450px;
            overflow: hidden; /* 裁剪溢出的模糊背景 */
        }

        /* 利用 ::before 伪元素做放大模糊的底层背景 */
        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 换成你真实的图片地址 */
            background-image: url('https://picsum.photos/300/450'); 
            background-size: cover;
            background-position: center;
            /* 降低30%模糊度，同时保持暗色背景 */
            filter: blur(14px) brightness(1); 
            z-index: 1;
        }

        /* 前景图标容器 */
        .icon {
            position: absolute;
            top: 12%;      /* 调整上下位置 */
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 100px;
            border-radius: 24px; /* 原图图标圆角 */
            overflow: hidden;    /* 确保图片在圆角内 */
            z-index: 2;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6); /* 增加投影使其突出 */
        }

        /* 前景 img 标签样式 */
        .icon img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 图片铺满且不变形 */
            display: block;
        }

        /* 底部文字样式（对应原图） */
        .bottom-text {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 28px;
            letter-spacing: 2px;
            padding-bottom: 15px;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 前景小图标 -->
        <div class="icon">
            <!-- 这里的 src 也需要换成真实图片地址 -->
            <img src="https://picsum.photos/300/450" alt="图标">
        </div>
        
        <!-- 底部文字 -->
        <div class="bottom-text">五...</div>
    </div>

</body>
</html>
